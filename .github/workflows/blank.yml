name: qwen35-ultra-verbose-bench-1-10-embedded

on:
  workflow_dispatch:
    inputs:
      subset_sizes:
        description: 'Comma-separated subset sizes to benchmark'
        required: false
        default: '1,10'
      model_name:
        description: 'MLX model id'
        required: false
        default: 'mlx-community/Qwen3.5-2B-MLX-4bit'
      learning_rate:
        description: 'LoRA learning rate'
        required: false
        default: '1e-4'
      max_train_iters_per_run:
        description: 'Maximum train iterations per subset'
        required: false
        default: '20'

jobs:
  benchmark:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '1'
      PROJECT_NAME: qwen35_ultra_verbose_bench_1_10
      EMBEDDED_DATASET_GZ_B64: |
        

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/Library/Caches/huggingface
          key: ${{ runner.os }}-${{ runner.arch }}-hf-qwen35-2b-mlx4bit-v1

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install mlx-lm huggingface_hub hf_transfer

      - name: Run embedded 1 and 10 sample benchmark
        shell: bash
        run: |
          set -euxo pipefail
          cat > run_embedded_benchmark.py <<'PY'
          import os
          import gc
          import sys
          import json
          import time
          import gzip
          import base64
          import shutil
          import pathlib
          import subprocess

          PROJECT_NAME = os.environ.get("PROJECT_NAME", "qwen35_ultra_verbose_bench_1_10")
          MODEL_NAME = os.environ.get("INPUT_MODEL_NAME") or os.environ.get("MODEL_NAME_OVERRIDE") or "${{ inputs.model_name }}"
          LEARNING_RATE = os.environ.get("INPUT_LEARNING_RATE") or "${{ inputs.learning_rate }}"
          MAX_TRAIN_ITERS = int(os.environ.get("INPUT_MAX_TRAIN_ITERS_PER_RUN") or "${{ inputs.max_train_iters_per_run }}")
          SUBSET_SIZES_RAW = os.environ.get("INPUT_SUBSET_SIZES") or "${{ inputs.subset_sizes }}"
          EMBEDDED_DATASET_GZ_B64 = os.environ["EMBEDDED_DATASET_GZ_B64"]

          def log(title):
              print("=" * 120)
              print(title)
              print("=" * 120)

          def sanitize_text(text):
              if text is None:
                  return ""
              return str(text).replace("\r\n", "\n").replace("\r", "\n").strip()

          def truncate_text(text, max_chars):
              text = sanitize_text(text)
              if len(text) <= max_chars:
                  return text
              return text[:max_chars]

          def build_ultra_verbose_example(record):
              problem = truncate_text(record.get("problem", ""), 1200)
              thinking = truncate_text(record.get("thinking", ""), 2000)
              solution = truncate_text(record.get("solution", ""), 600)

              prompt = (
                  "You are an ultra-verbose mathematical reasoning assistant. "
                  "Solve the following problem carefully, explain every major step, "
                  "double-check the arithmetic, and then provide a final answer.\n\n"
                  "Problem:\n"
                  f"{problem}\n\n"
                  "Respond in this format:\n"
                  "<think>your detailed reasoning</think>\n"
                  "Final answer: your final answer"
              )

              completion = (
                  "<think>\n"
                  f"{thinking}\n"
                  "</think>\n\n"
                  "Final answer:\n"
                  f"{solution}"
              )

              return {"prompt": prompt, "completion": completion}

          def decode_records():
              payload = "".join(EMBEDDED_DATASET_GZ_B64.split())
              raw = gzip.decompress(base64.b64decode(payload))
              return json.loads(raw.decode("utf-8"))

          def parse_sizes(raw, limit):
              vals = []
              for part in raw.split(","):
                  part = part.strip()
                  if not part:
                      continue
                  n = int(part)
                  if n <= 0:
                      continue
                  vals.append(min(n, limit))
              seen = set()
              out = []
              for v in vals:
                  if v not in seen:
                      seen.add(v)
                      out.append(v)
              return out

          def write_jsonl(path, rows):
              with open(path, "w", encoding="utf-8") as f:
                  for row in rows:
                      f.write(json.dumps(row, ensure_ascii=False) + "\n")

          def run_cmd(cmd):
              start = time.perf_counter()
              proc = subprocess.run(cmd, capture_output=True, text=True)
              elapsed = time.perf_counter() - start
              return proc, elapsed

          def timed_generate(model_name, prompt, adapter_path=None):
              cmd = [
                  "python", "-m", "mlx_lm", "generate",
                  "--model", model_name,
                  "--prompt", prompt,
                  "--max-tokens", "256",
                  "--temp", "0",
              ]
              if adapter_path:
                  cmd.extend(["--adapter-path", adapter_path])
              proc, elapsed = run_cmd(cmd)
              stdout = proc.stdout.strip()
              stderr = proc.stderr.strip()
              return proc.returncode, stdout, stderr, elapsed

          def main():
              log("SCRIPT START")
              print(f"python_executable: {sys.executable}")
              print(f"python_version: {sys.version}")
              print(f"cwd: {os.getcwd()}")
              print(f"project_name: {PROJECT_NAME}")
              print(f"model_name: {MODEL_NAME}")
              print(f"learning_rate: {LEARNING_RATE}")
              print(f"max_train_iters_per_run: {MAX_TRAIN_ITERS}")

              all_records = decode_records()
              print(f"embedded_record_count: {len(all_records)}")
              subset_sizes = parse_sizes(SUBSET_SIZES_RAW, len(all_records))
              print(f"subset_sizes: {subset_sizes}")

              if not subset_sizes:
                  raise RuntimeError("No valid subset sizes were provided.")

              work_root = pathlib.Path(f"./{PROJECT_NAME}_work")
              if work_root.exists():
                  shutil.rmtree(work_root)
              work_root.mkdir(parents=True, exist_ok=True)

              results = []

              for subset_size in subset_sizes:
                  log(f"SUBSET RUN START n={subset_size}")
                  subset_records = all_records[:subset_size]
                  examples = [build_ultra_verbose_example(r) for r in subset_records]

                  subset_dir = work_root / f"subset_{subset_size}"
                  data_dir = subset_dir / "data"
                  adapter_dir = subset_dir / "adapters"
                  data_dir.mkdir(parents=True, exist_ok=True)
                  adapter_dir.mkdir(parents=True, exist_ok=True)

                  train_rows = examples
                  valid_rows = examples[:1]
                  test_rows = examples[:1]

                  write_jsonl(data_dir / "train.jsonl", train_rows)
                  write_jsonl(data_dir / "valid.jsonl", valid_rows)
                  write_jsonl(data_dir / "test.jsonl", test_rows)

                  print(f"train_rows: {len(train_rows)}")
                  print(f"sample_prompt_preview: {train_rows[0]['prompt'][:300]!r}")
                  print(f"sample_completion_preview: {train_rows[0]['completion'][:300]!r}")

                  probe_prompt = train_rows[0]["prompt"]

                  log(f"BASE FORWARD CHECK n={subset_size}")
                  base_rc, base_out, base_err, base_elapsed = timed_generate(MODEL_NAME, probe_prompt)
                  print(f"base_return_code: {base_rc}")
                  print(f"base_elapsed_seconds: {base_elapsed:.6f}")
                  print(f"base_stdout_preview: {base_out[:500]!r}")
                  if base_err:
                      print(f"base_stderr_preview: {base_err[:500]!r}")
                  if base_rc != 0:
                      raise RuntimeError("Base forward pass failed.")

                  del base_out, base_err
                  gc.collect()
                  time.sleep(3)

                  train_iters = min(MAX_TRAIN_ITERS, max(1, subset_size))
                  log(f"TRAIN START n={subset_size}")
                  train_cmd = [
                      "python", "-m", "mlx_lm", "lora",
                      "--train",
                      "--model", MODEL_NAME,
                      "--data", str(data_dir),
                      "--adapter-path", str(adapter_dir),
                      "--iters", str(train_iters),
                      "--batch-size", "1",
                      "--learning-rate", str(LEARNING_RATE),
                      "--steps-per-report", "1",
                      "--steps-per-eval", "1000000",
                      "--mask-prompt",
                  ]
                  print("train_command:", " ".join(train_cmd))
                  train_proc, train_elapsed = run_cmd(train_cmd)
                  print("TRAIN STDOUT START")
                  print(train_proc.stdout)
                  print("TRAIN STDOUT END")
                  if train_proc.stderr:
                      print("TRAIN STDERR START")
                      print(train_proc.stderr)
                      print("TRAIN STDERR END")
                  print(f"train_return_code: {train_proc.returncode}")
                  print(f"train_elapsed_seconds: {train_elapsed:.6f}")
                  if train_proc.returncode != 0:
                      raise RuntimeError(f"Training failed for subset {subset_size}")

                  adapter_file = adapter_dir / "adapters.safetensors"
                  if not adapter_file.exists():
                      raise RuntimeError(f"Expected adapter file missing for subset {subset_size}")

                  log(f"TUNED FORWARD BENCH n={subset_size}")
                  forward_times = []
                  forward_runs = min(3, len(test_rows))
                  for idx in range(forward_runs):
                      prompt = test_rows[idx % len(test_rows)]["prompt"]
                      rc, out, err, elapsed = timed_generate(MODEL_NAME, prompt, str(adapter_dir))
                      print(f"forward_run_{idx+1:03d}_return_code: {rc}")
                      print(f"forward_run_{idx+1:03d}_elapsed_seconds: {elapsed:.6f}")
                      print(f"forward_run_{idx+1:03d}_stdout_preview: {out[:500]!r}")
                      if err:
                          print(f"forward_run_{idx+1:03d}_stderr_preview: {err[:500]!r}")
                      if rc != 0:
                          raise RuntimeError(f"Tuned forward pass failed for subset {subset_size} run {idx+1}")
                      forward_times.append(elapsed)

                  avg_forward = sum(forward_times) / len(forward_times)
                  sec_per_iter = train_elapsed / train_iters if train_iters else float("nan")

                  results.append({
                      "subset_size": subset_size,
                      "train_iters": train_iters,
                      "train_elapsed_seconds": train_elapsed,
                      "train_seconds_per_iter": sec_per_iter,
                      "base_forward_seconds": base_elapsed,
                      "tuned_forward_avg_seconds": avg_forward,
                      "projected_tuned_forward_1k_seconds": avg_forward * 1000.0,
                      "projected_tuned_forward_10k_seconds": avg_forward * 10000.0,
                  })

                  gc.collect()
                  time.sleep(2)

              log("FINAL SUMMARY")
              print(json.dumps(results, indent=2))

          if __name__ == "__main__":
              main()
          PY
          INPUT_SUBSET_SIZES="${{ inputs.subset_sizes }}" \
          INPUT_MODEL_NAME="${{ inputs.model_name }}" \
          INPUT_LEARNING_RATE="${{ inputs.learning_rate }}" \
          INPUT_MAX_TRAIN_ITERS_PER_RUN="${{ inputs.max_train_iters_per_run }}" \
          python run_embedded_benchmark.py
